<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 100%;
            text-align: center;
            overflow: hidden;
        }
        .card-header {
            background-color: #2c3e50;
            padding: 30px 20px;
        }
        .card-header img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #fff;
            object-fit: cover;
        }
        .card-body {
            padding: 20px 25px 30px;
        }
        .card-body h2 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .card-body p.jurusan {
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            text-align: left;
            border-collapse: collapse;
        }
        table td {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 15px;
            color: #333;
        }
        table td.label {
            font-weight: bold;
            width: 40%;
            color: #2c3e50;
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <img src="https://via.placeholder.com/120" alt="Foto Profil">
        </div>
        <div class="card-body">
            <h2>Nama Mahasiswa</h2>
            <p class="jurusan">Sistem Informasi</p>
            <table>
                <tr>
                    <td class="label">NIM</td>
                    <td>123456789</td>
                </tr>
                <tr>
                    <td class="label">Kelas</td>
                    <td>SI-7A</td>
                </tr>
                <tr>
                    <td class="label">Mata Kuliah</td>
                    <td>Sistem Terdistribusi</td>
                </tr>
                <tr>
                    <td class="label">Email</td>
                    <td>mahasiswa@email.com</td>
                </tr>
                <tr>
                    <td class="label">Alamat</td>
                    <td>Jakarta, Indonesia</td>
                </tr>
            </table>
            <div class="footer">
                &copy; 2026 Profil Mahasiswa
            </div>
        </div>
    </div>
</body>
</html>
